version: "3.9"
services:
  backend:
    build: ./backend
    container_name: eeg_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    networks:
      - eegnet

  simulator:
    build: ./simulator
    container_name: eeg_simulator
    depends_on:
      - backend
    environment:
      - SERVER_URI=ws://backend:8000/v1/ws/eeg
    networks:
      - eegnet

networks:
  eegnet:
    driver: bridge
